<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="dycGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded hexagon / chip container -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#0d131f" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Subtle inner ambient mesh -->
  <rect x="5" y="5" width="54" height="54" rx="13" fill="none" stroke="url(#dycGradient)" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- Execution flow circuit lines -->
  <path d="M14 20 L22 20 L27 27 L37 27 L42 20 L50 20" stroke="#00f0ff" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round"/>
  <path d="M14 44 L22 44 L27 37 L37 37 L42 44 L50 44" stroke="#8b5cf6" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round"/>

  <!-- Code bracket execution path left '<' -->
  <path d="M23 23 L14 32 L23 41" stroke="url(#dycGradient)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Code bracket execution path right '>' -->
  <path d="M41 23 L50 32 L41 41" stroke="url(#dycGradient)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Central node / pulse point (Execution core) -->
  <circle cx="32" cy="32" r="5" fill="#00f0ff" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="2.5" fill="#ffffff"/>
  
  <!-- Execution connection pulses -->
  <path d="M22 32 L27 32" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M37 32 L42 32" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round"/>
</svg>
